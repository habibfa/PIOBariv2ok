<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Translucent Emerald Glass Gradient -->
    <radialGradient id="bgRadial" cx="45%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="25%" stop-color="#10B981" />
      <stop offset="65%" stop-color="#047857" />
      <stop offset="95%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </radialGradient>

    <!-- Glass Rim Specular Highlight Gradient -->
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#A7F3D0" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.3" />
      <stop offset="85%" stop-color="#34D399" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
    </linearGradient>

    <!-- Top Curved Gloss Sheen Reflection -->
    <linearGradient id="topSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Bottom Rim Gloss Reflection -->
    <linearGradient id="bottomSheen" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#6EE7B7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Book Pages Gradients -->
    <linearGradient id="bookSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0FDFA" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Drop Shadows and Glow Filters -->
    <filter id="badgeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#022C22" flood-opacity="0.4" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#022C22" flood-opacity="0.5" />
    </filter>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. TRANSPARENT BACKGROUND (No outer fill - fully transparent outside squircle) -->

  <!-- 2. BASE GLASS SQUIRCLE WITH 3D GLASS REFLECTIONS -->
  <g filter="url(#badgeShadow)">
    <!-- Main Glass Body -->
    <rect x="22" y="22" width="468" height="468" rx="108" fill="url(#bgRadial)" />
    
    <!-- Outer Glass Specular Border -->
    <rect x="23" y="23" width="466" height="466" rx="107" fill="none" stroke="url(#glassBorder)" stroke-width="4" />

    <!-- Top Sheen Gloss -->
    <path d="M 26,128 C 26,68 68,26 128,26 L 384,26 C 444,26 486,68 486,128 C 486,190 380,180 256,192 C 132,204 26,190 26,128 Z" fill="url(#topSheen)" />

    <!-- Bottom Crescent Reflection -->
    <path d="M 80,466 C 135,482 195,486 256,486 C 317,486 377,482 432,466 C 382,476 322,480 256,480 C 190,480 130,476 80,466 Z" fill="url(#bottomSheen)" filter="url(#glow)" />
  </g>

  <!-- 3. STAR SPARKLE (Left Glass Edge) -->
  <g transform="translate(36, 218) scale(0.75)">
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" opacity="0.6" filter="url(#glow)" />
    <path d="M 0,-24 L 3,-6 L 24,0 L 3,6 L 0,24 L -3,6 L -24,0 L -3,-6 Z" fill="#FFFFFF" />
  </g>

  <!-- 4. MEDICAL EMBLEMS & OPEN BOOK (Centered composition) -->
  <g filter="url(#softShadow)">
    <!-- Circular Medical Cross Badge (Behind Capsule) -->
    <g transform="translate(208, 140)">
      <circle cx="0" cy="0" r="48" fill="#F0FDFA" stroke="#99F6E4" stroke-width="3" />
      <!-- Medical Cross (+) -->
      <rect x="-8.5" y="-26" width="17" height="52" rx="5" fill="#10B981" />
      <rect x="-26" y="-8.5" width="52" height="17" rx="5" fill="#10B981" />
    </g>

    <!-- Open Book (Beneath symbols) -->
    <g transform="translate(256, 222)">
      <!-- Book Pages Outer -->
      <path d="M 0,16 C -52,6 -108,-4 -148,26 C -151,16 -110,-14 0,0 C 110,-14 151,16 148,26 C 108,-4 52,6 0,16 Z" fill="url(#bookSheen)" stroke="#5EEAD4" stroke-width="2.5" />
      <!-- Page thickness layer -->
      <path d="M 0,24 C -52,14 -108,4 -151,34 C -153,26 -112,-4 0,8 C 112,-4 153,26 151,34 C 108,4 52,14 0,24 Z" fill="#CCFBF1" opacity="0.85" />
    </g>

    <!-- 3D Capsule Pill (Tilted -40deg) -->
    <g transform="translate(266, 148) rotate(-40)">
      <!-- Pill Outline Border -->
      <rect x="-26" y="-56" width="52" height="112" rx="26" fill="none" stroke="#FFFFFF" stroke-width="4.5" />
      <!-- Top Half (Green) -->
      <path d="M -25,0 L 25,0 L 25,-30 C 25,-44 15,-55 0,-55 C -15,-55 -25,-44 -25,-30 Z" fill="url(#pillGreen)" />
      <!-- Bottom Half (White) -->
      <path d="M -25,0 L 25,0 L 25,30 C 25,44 15,55 0,55 C -15,55 -25,44 -25,30 Z" fill="#FFFFFF" />
      <!-- Pill Center Divider -->
      <line x1="-25" y1="0" x2="25" y2="0" stroke="#047857" stroke-width="2" />
      <!-- Specular Highlight Stripe -->
      <rect x="-15" y="-48" width="6" height="42" rx="3" fill="#FFFFFF" opacity="0.75" />
    </g>

    <!-- Magnifying Glass with letter 'i' (Information) -->
    <g transform="translate(310, 172)">
      <!-- Handle -->
      <line x1="26" y1="26" x2="48" y2="48" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
      <!-- Outer White Ring -->
      <circle cx="0" cy="0" r="39" fill="#047857" stroke="#FFFFFF" stroke-width="7" />
      <!-- Inner Green Lens -->
      <circle cx="0" cy="0" r="34" fill="#059669" opacity="0.95" />
      <!-- Letter 'i' inside lens -->
      <circle cx="0" cy="-14" r="5.5" fill="#FFFFFF" />
      <rect x="-5" y="-3" width="10" height="24" rx="5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- 5. MAIN DISPLAY TYPOGRAPHY: "P I O" -->
  <g filter="url(#softShadow)">
    <!-- Letter P -->
    <path d="M 136,260 L 178,260 C 206,260 222,274 222,296 C 222,318 206,332 178,332 L 164,332 L 164,356 C 164,361 160,365 155,365 L 145,365 C 140,365 136,361 136,356 Z M 164,284 L 164,308 L 176,308 C 190,308 198,303 198,296 C 198,289 190,284 176,284 Z" fill="#FFFFFF" />

    <!-- Letter I -->
    <rect x="238" y="260" width="27" height="105" rx="9" fill="#FFFFFF" />

    <!-- Letter O with nested Pill -->
    <g transform="translate(322, 312.5)">
      <!-- Outer O Circle -->
      <circle cx="0" cy="0" r="52.5" fill="#FFFFFF" />
      <!-- Inner Cutout -->
      <circle cx="0" cy="0" r="28" fill="#059669" />
      
      <!-- Mini Pill inside O -->
      <g transform="rotate(-40) scale(0.48)">
        <!-- Green Half -->
        <path d="M -18,0 L 18,0 L 18,-24 C 18,-34 10,-42 0,-42 C -10,-42 -18,-34 -18,-24 Z" fill="#34D399" />
        <!-- White Half -->
        <path d="M -18,0 L 18,0 L 18,24 C 18,34 10,42 0,42 C -10,42 -18,34 -18,24 Z" fill="#FFFFFF" />
      </g>
    </g>
  </g>

  <!-- 6. SUB-DIVIDER: "— BARI —" -->
  <g transform="translate(256, 396)">
    <!-- Left Dash -->
    <rect x="-142" y="-3.5" width="46" height="7" rx="3.5" fill="#5EEAD4" />
    
    <!-- BARI Text -->
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif, 'Segoe UI'" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="4" text-anchor="middle">BARI</text>
    
    <!-- Right Dash -->
    <rect x="96" y="-3.5" width="46" height="7" rx="3.5" fill="#5EEAD4" />
  </g>

  <!-- 7. SUBTITLES -->
  <text x="256" y="438" font-family="system-ui, -apple-system, sans-serif, 'Segoe UI'" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Pusat Informasi Obat</text>
  <text x="256" y="468" font-family="system-ui, -apple-system, sans-serif, 'Segoe UI'" font-size="18" font-weight="700" fill="#CCFBF1" text-anchor="middle" letter-spacing="0.8">RSUD Palembang BARI</text>
</svg>